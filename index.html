
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveM 犯罪報酬計算機</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    min-height: 100vh;
    background: #242424;
    color: #fff;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 20px auto;
    padding: 25px;
    background: #303030;
    border: 1px solid #444;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1 {
    margin: 0 0 25px;
    text-align: center;
    font-size: 24px;
}

.input-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #3b3b3b;
    color: white;
    font-size: 17px;
}

input:focus {
    outline: 1px solid #999;
}

.calculate-button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #555;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculate-button:hover {
    background: #686868;
}

.error {
    margin-top: 12px;
    color: #ff7777;
    font-size: 14px;
    text-align: center;
}

.result {
    margin-top: 18px;
    padding: 15px;
    background: #262626;
    border: 1px solid #444;
    border-radius: 10px;
}

.result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid #444;
}

.result-row:last-child {
    border-bottom: none;
}

.result-info {
    flex: 1;
    min-width: 0;
}

.result-label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #ddd;
}

.amount {
    display: block;
    font-size: 19px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.copy-button {
    flex-shrink: 0;
    padding: 9px 8px;
    border: none;
    border-radius: 6px;
    background: #555;
    color: white;
    font-size: 12px;
    cursor: pointer;
}

.copy-button:hover {
    background: #686868;
}

.main-result .amount {
    color: #c8b2ff;
    font-size: 22px;
}

.fine-result .amount {
    color: #ffd18a;
    font-size: 21px;
}

.copy-message {
    min-height: 20px;
    margin-top: 12px;
    color: #9be29b;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 380px) {
    .container {
        padding: 17px 12px;
    }

    h1 {
        font-size: 21px;
    }

    .result {
        padding: 10px;
    }

    .amount {
        font-size: 16px;
    }

    .main-result .amount,
    .fine-result .amount {
        font-size: 18px;
    }

    .copy-button {
        padding: 8px 5px;
        font-size: 11px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>💰 FiveM 犯罪報酬計算機</h1>

    <div class="input-group">
        <label for="totalReward">全体の報酬額</label>
        <input type="number" id="totalReward"
               placeholder="例：100000" min="0">
    </div>

    <div class="input-group">
        <label for="fineAmount">罰金額（1人当たり）</label>
        <input type="number" id="fineAmount"
               placeholder="例：5000" min="0" value="0">
    </div>

    <div class="input-group">
        <label for="finedPlayers">罰金を受けた人数</label>
        <input type="number" id="finedPlayers"
               placeholder="例：2" min="0" step="1" value="0">
    </div>

    <div class="input-group">
        <label for="players">分配する人数</label>
        <input type="number" id="players"
               placeholder="例：4" min="1" step="1">
    </div>

    <div class="input-group">
        <label for="poolRate">プール徴収割合（%）</label>
        <input type="number" id="poolRate"
               placeholder="例：20" min="0" max="100"
               step="0.1" value="0">
    </div>

    <button class="calculate-button" onclick="calculate()">
        計算する
    </button>

    <div id="error" class="error"></div>

    <div class="result">

        <div class="result-row">
            <div class="result-info">
                <span class="result-label">💰 全体報酬額</span>
                <span class="amount" id="displayTotal">$0</span>
            </div>
            <button class="copy-button"
                    onclick="copyValue('totalReward')">📋 コピー</button>
        </div>

        <div class="result-row">
            <div class="result-info">
                <span class="result-label">🚔 罰金合計</span>
                <span class="amount" id="fineTotal">$0</span>
            </div>
            <button class="copy-button"
                    onclick="copyValue('fineTotal')">📋 コピー</button>
        </div>

        <div class="result-row">
            <div class="result-info">
                <span class="result-label">🏦 プール徴収額</span>
                <span class="amount" id="poolAmount">$0</span>
            </div>
            <button class="copy-button"
                    onclick="copyValue('poolAmount')">📋 コピー</button>
        </div>

        <div class="result-row main-result">
            <div class="result-info">
                <span class="result-label">👤 1人当たりの報酬額</span>
                <span class="amount" id="perPerson">$0</span>
            </div>
            <button class="copy-button"
                    onclick="copyValue('perPerson')">📋 コピー</button>
        </div>

        <div class="result-row fine-result">
            <div class="result-info">
                <span class="result-label">🚔 罰金ありの人の報酬額</span>
                <span class="amount" id="perPersonWithFine">$0</span>
            </div>
            <button class="copy-button"
                    onclick="copyValue('perPersonWithFine')">📋 コピー</button>
        </div>

    </div>

    <div id="copyMessage" class="copy-message"></div>
</div>

<script>
function getInputs() {
    return {
        totalReward: Number(document.getElementById("totalReward").value),
        fineAmount: document.getElementById("fineAmount").value === ""
            ? 0 : Number(document.getElementById("fineAmount").value),
        finedPlayers: document.getElementById("finedPlayers").value === ""
            ? 0 : Number(document.getElementById("finedPlayers").value),
        players: Number(document.getElementById("players").value),
        poolRate: document.getElementById("poolRate").value === ""
            ? 0 : Number(document.getElementById("poolRate").value)
    };
}

function calculate() {
    const {
        totalReward, fineAmount, finedPlayers, players, poolRate
    } = getInputs();

    const error = document.getElementById("error");
    error.textContent = "";
    document.getElementById("copyMessage").textContent = "";

    if (!Number.isFinite(totalReward) || totalReward <= 0) {
        error.textContent = "全体の報酬額を入力してください。";
        return;
    }

    if (!Number.isFinite(fineAmount) || fineAmount < 0) {
        error.textContent = "罰金額は0以上で入力してください。";
        return;
    }

    if (!Number.isInteger(finedPlayers) || finedPlayers < 0) {
        error.textContent = "罰金を受けた人数は0以上の整数で入力してください。";
        return;
    }

    if (!Number.isInteger(players) || players <= 0) {
        error.textContent = "分配する人数を1人以上入力してください。";
        return;
    }

    if (!Number.isFinite(poolRate) || poolRate < 0 || poolRate > 100) {
        error.textContent = "プール徴収割合は0～100%で入力してください。";
        return;
    }

    // 罰金合計
    const fineTotal = fineAmount * finedPlayers;

    if (fineTotal > totalReward) {
        error.textContent = "罰金合計が全体報酬額を超えています。";
        return;
    }

    // 罰金差引後の金額
    const afterFine = totalReward - fineTotal;

    // プール徴収額（罰金差引後の金額を基準）
    const poolAmount = afterFine * (poolRate / 100);

    // 分配対象額
    const distributionAmount = afterFine - poolAmount;

    // 1人当たりの報酬額
    const perPerson = distributionAmount / players;

    // 罰金ありの人の報酬額
    // 1人当たりの報酬額に入力した罰金額を加算
    const perPersonWithFine = perPerson + fineAmount;

    // マイナスにならないか確認
    if (perPersonWithFine < 0) {
        error.textContent = "計算結果が不正です。入力内容を確認してください。";
        return;
    }

    document.getElementById("displayTotal").textContent =
        "$" + formatNumber(totalReward);

    document.getElementById("fineTotal").textContent =
        "$" + formatNumber(fineTotal);

    document.getElementById("poolAmount").textContent =
        "$" + formatNumber(poolAmount);

    document.getElementById("perPerson").textContent =
        "$" + formatNumber(perPerson);

    document.getElementById("perPersonWithFine").textContent =
        "$" + formatNumber(perPersonWithFine);
}

function formatNumber(number) {
    return number.toLocaleString("ja-JP", {
        maximumFractionDigits: 2
    });
}

function copyValue(type) {
    const {
        totalReward, fineAmount, finedPlayers, players, poolRate
    } = getInputs();

    const error = document.getElementById("error");
    const message = document.getElementById("copyMessage");

    error.textContent = "";
    message.textContent = "";

    if (!Number.isFinite(totalReward) || totalReward <= 0 ||
        !Number.isFinite(fineAmount) || fineAmount < 0 ||
        !Number.isInteger(finedPlayers) || finedPlayers < 0 ||
        !Number.isInteger(players) || players <= 0 ||
        !Number.isFinite(poolRate) || poolRate < 0 || poolRate > 100) {
        message.textContent = "先に正しい値を入力して計算してください。";
        return;
    }

    const fineTotal = fineAmount * finedPlayers;
    const afterFine = totalReward - fineTotal;

    if (fineTotal > totalReward) {
        message.textContent = "罰金合計が全体報酬額を超えています。";
        return;
    }

    const poolAmount = afterFine * (poolRate / 100);
    const distributionAmount = afterFine - poolAmount;
    const perPerson = distributionAmount / players;
    const perPersonWithFine = perPerson + fineAmount;

    const values = {
        totalReward,
        fineTotal,
        poolAmount,
        perPerson,
        perPersonWithFine
    };

    const value = values[type];

    if (!Number.isFinite(value)) {
        message.textContent = "計算結果を確認してください。";
        return;
    }

    // コピーする値は数字のみ（$やカンマは付けない）
    const copyText = String(Math.round(value * 100) / 100);

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText)
            .then(() => {
                message.textContent = "✓ " + copyText + " をコピーしました！";
            })
            .catch(() => fallbackCopy(copyText, message));
    } else {
        fallbackCopy(copyText, message);
    }
}

function fallbackCopy(text, message) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();

    const succeeded = document.execCommand("copy");
    textarea.remove();

    message.textContent = succeeded
        ? "✓ " + text + " をコピーしました！"
        : "コピーに失敗しました。";
}

document.querySelectorAll("input").forEach(function(input) {
    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") calculate();
    });
});
</script>
</body>
</html>
